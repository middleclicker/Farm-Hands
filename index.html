<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4eddb" />
    <title>Farm Hands</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css?v=weather-clear-field-1" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.js" } }
    </script>
    <script type="module" src="./game.js?v=weather-clear-field-1"></script>
  </head>
  <body>
    <main class="game-shell">
      <section class="farm" aria-label="3D wheat planting field">
        <canvas id="field" tabindex="0" aria-label="3D wheat field. Drag to rotate, scroll or pinch to zoom. Use arrow keys to select a plot and Enter to plant wheat." aria-describedby="field-help field-status"></canvas>
        <canvas id="rain-overlay" aria-hidden="true" hidden></canvas>

        <div class="weather-controls">
          <label for="weather-select">Weather</label>
          <select id="weather-select" aria-describedby="weather-description">
            <option value="sunny">Normal sunlight</option>
            <option value="light">Light rain</option>
            <option value="moderate">Moderate rain</option>
            <option value="heavy">Heavy rain</option>
          </select>
          <span id="weather-description" class="weather-description" aria-live="polite">Clear skies and warm sunlight.</span>
        </div>

        <div class="sr-only">
          <h1>Farm Hands</h1>
          <p id="field-help">Click or tap to plant. Drag to rotate. Scroll or pinch to zoom. Use arrow keys to select a plot and Enter to plant.</p>
          <p class="field-status" id="field-status" role="status">Choose a soil plot to plant wheat.</p>
        </div>
      </section>
    </main>
  </body>
</html>
